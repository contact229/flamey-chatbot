// LIGHTWEIGHT TYPO TOLERANCE
// Swaps obviously-mistyped domain words ("bolier", "instalation") for their correct
// spelling before intent matching runs, without any external library or API call.
// ════════════════════════════════════════════════════════════════════════════════
function levenshtein(a, b) {
  // Optimal-string-alignment distance: like Levenshtein but also treats an
  // adjacent transposition ("bolier" -> "boiler") as a single edit, since
  // swapped letters are one of the most common typing mistakes.
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const d = [];
  for (let i = 0; i <= m; i++) d.push(new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) d[i][0] = i;
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
        d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
      }
    }
  }
  return d[m][n];
}

  return msg.split(/\s+/).map(word => {
    const clean = word.replace(/[^a-z]/gi, '').toLowerCase();
    if (clean.length < 4) return word;
    let best = null, bestDist = Infinity;
    for (const term of FUZZY_TERMS) {
      if (Math.abs(term.length - clean.length) > 2) continue;
      const d = levenshtein(clean, term);
      if (d < bestDist) { bestDist = d; best = term; }
    }
    const threshold = clean.length <= 6 ? 1 : 2;
    return (best && bestDist > 0 && bestDist <= threshold) ? best : word;
  }).join(' ');
}

// ════════════════════════════════════════════════════════════════════════════════
// INTENT RECOGNITION — HELP-FIRST MENTALITY
// Checked in order of priority: safety first, then price, then specific services,
// falling back to a general-help menu only when nothing else matches.
// ════════════════════════════════════════════════════════════════════════════════
function analyzeIntent(userMessageRaw) {
  const msg = normalizeTypos(userMessageRaw.toLowerCase());

  // HARD URGENCY (safety-critical only — plain "broken"/"not working" is NOT
  // treated as urgent on its own, since that routes to the repairs intent instead)
  if (/(gas smell|smell(ing)? gas|smell of gas|gas leak|leaking gas|flooding|\bflood\b|\bemergency\b|\burgent\b|\basap\b|right now|immediately)/.test(msg)) {
    return { intent: 'urgent_booking', confidence: 0.98 };
  }

  // PRICE INQUIRIES
  if (/(how much|price|cost|charge|fee|pricing|quote)/.test(msg)) {
    if (/(boiler service|service boiler|annual service)/.test(msg)) {
      return { intent: 'price_boiler_service', confidence: 0.95 };
    }
    if (/(new boiler|boiler install|replacement)/.test(msg)) {
      return { intent: 'price_installation', confidence: 0.95 };
    }
    if (/(repair|fix)/.test(msg)) {
      return { intent: 'price_repair', confidence: 0.9 };
    }
    if (/(landlord|certificate|gas safe|cp12)/.test(msg)) {
      return { intent: 'price_landlord_cert', confidence: 0.95 };
    }
    return { intent: 'pricing_general', confidence: 0.85 };
  }

  // GREETING
  if (/^(hi|hello|hey|good morning|good afternoon|good evening|hiya)\b/.test(msg)) {
    return { intent: 'greeting', confidence: 0.9 };
  }

  // SERVICE-SPECIFIC INQUIRIES
  if (/(boiler service|annual service|service boiler|boiler check)/.test(msg)) {
    return { intent: 'boiler_service_info', confidence: 0.9 };
  }

  if (/(water softener|hard water|limescale|scale)/.test(msg)) {
    return { intent: 'water_softener', confidence: 0.9 };
  }

  if (/(\blpg\b|propane|bottled gas|gas tank)/.test(msg)) {
    return { intent: 'lpg', confidence: 0.9 };
  }

  if (/(plumbing|bathroom|\btap\b|shower|toilet|\bdrain\b|drainage)/.test(msg)) {
    return { intent: 'plumbing', confidence: 0.85 };
  }

  if (/(cooker|\bhob\b|\bfire\b|hot water cylinder|cylinder)/.test(msg)) {
    return { intent: 'appliances', confidence: 0.85 };
  }

  if (/(new boiler|boiler install|\binstallation\b|\binstall\b|replacement|upgrade)/.test(msg)) {
    return { intent: 'installation', confidence: 0.9 };
  }

  if (/(repair|fix|broken|fault|not working|stopped working|no heating|no hot water|leak|leaking|pilot light|no pressure)/.test(msg)) {
    return { intent: 'repairs', confidence: 0.85 };
  }

  if (/(landlord|certificate|cp12|gas safe check|letting)/.test(msg)) {
    return { intent: 'landlord_cert', confidence: 0.9 };
  }

  // LOCATION/COVERAGE
  if (/(\barea\b|\bcover\b|location|\bwhere\b|region|do you serve|come to|postcode)/.test(msg)) {
    return { intent: 'coverage', confidence: 0.85 };
  }

  // BOOKING/CONTACT
  if (/(\bbook\b|appointment|\bvisit\b|arrange|schedule|come out)/.test(msg)) {
    return { intent: 'booking', confidence: 0.9 };
  }

  return { intent: 'general_help', confidence: 0.6 };
}

// ════════════════════════════════════════════════════════════════════════════════
// CONVERSATION CONTEXT — lets short follow-ups ("ok", "how much is that") resolve
// against whatever was just being discussed, instead of being treated as brand-new,
// context-free questions every time.
// ════════════════════════════════════════════════════════════════════════════════
const conversationContext = {
  lastIntent: null,
  greetedOnce: false,
  fallbackCount: 0
};

const FOLLOWUP_RE = /^(ok|okay|yes|yeah|yep|sure|please do|sounds good|go ahead|book it|book that|do that|and that|what about that|how much is that|how much for that)[.!]?$/i;

const FOLLOWUP_BOOKING_TYPE = {
  boiler_service_info: 'service', price_boiler_service: 'service',
  installation: 'quote', price_installation: 'quote',
  repairs: 'repair', price_repair: 'repair',
  landlord_cert: 'certificate', price_landlord_cert: 'certificate',
  water_softener: 'quote', pricing_general: 'quote', coverage: 'quote',
  lpg: 'quote', plumbing: 'repair', appliances: 'quote'
};

function resolveFollowup(rawText) {
  const trimmed = rawText.trim();
  if (!FOLLOWUP_RE.test(trimmed) || !conversationContext.lastIntent) return null;
  const bookingType = FOLLOWUP_BOOKING_TYPE[conversationContext.lastIntent];
  if (!bookingType) return null;
  return { intent: 'followup_booking', confidence: 0.8, bookingType };
}

// ════════════════════════════════════════════════════════════════════════════════
// HTML ESCAPING — every piece of this file that renders raw user input (the chat
// box, and the name/phone/postcode/email/message fields on the booking form) now
// escapes it first. Previously user input went straight into innerHTML unescaped,
// which meant anything typed as HTML (e.g. a pasted <img onerror=...> tag) would
// run directly on the page.
// ════════════════════════════════════════════════════════════════════════════════
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

// ════════════════════════════════════════════════════════════════════════════════
// WEB3FORMS — lead capture + quiet "couldn't answer this" logging.
// Replaces the old EmailJS call, which shipped with a placeholder public key and
// so silently failed on every submission.
// ════════════════════════════════════════════════════════════════════════════════
async function sendToWeb3Forms(payload) {
  if (!web3formsConfigured()) return { success: false, skipped: true };
  try {
    const res = await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({ access_key: CONFIG.WEB3FORMS_ACCESS_KEY, ...payload })
    });
    const data = await res.json().catch(() => ({}));
    return { success: res.ok && !!data.success };
  } catch (error) {
    console.error('Web3Forms submission error:', error);
    return { success: false };
  }
}

async function logUnanswered(question) {
  try {
    const key = question.trim().toLowerCase();
    if (!key) return;
    const logged = JSON.parse(sessionStorage.getItem('flamey_logged_gaps') || '[]');
    if (logged.includes(key) || logged.length >= 5) return;
    logged.push(key);
    sessionStorage.setItem('flamey_logged_gaps', JSON.stringify(logged));
    await sendToWeb3Forms({
      subject: 'Flamey could not answer a customer question',
      from_name: 'Flamey chatbot',
      question: question,
      page: location.href,
      timestamp: new Date().toLocaleString('en-GB', { dateStyle: 'full', timeStyle: 'short' })
    });
  } catch (error) {
    console.error('Gap logging failed:', error);
  }
}

async function submitContactForm() {
  const rawName = document.getElementById('form-name')?.value.trim();
  const rawPostcode = document.getElementById('form-postcode')?.value.trim();
  const rawPhone = document.getElementById('form-phone')?.value.trim();
  const rawEmail = document.getElementById('form-email')?.value.trim();
  const rawMessage = document.getElementById('form-message')?.value.trim();

  if (!rawName || !rawPostcode || !rawPhone) {
    addMsg("⚠️ Please fill in all required fields (Name, Postcode, Phone)", true);
    return;
  }

  const name = escapeHtml(rawName);
  const postcode = escapeHtml(rawPostcode);
  const phone = escapeHtml(rawPhone);

  const submitBtn = document.querySelector('.submit-btn');
  const originalText = submitBtn.innerHTML;
  submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
  submitBtn.disabled = true;

  const result = await sendToWeb3Forms({
    subject: `New Flamey enquiry from ${rawName}`,
    from_name: rawName,
    name: rawName,
    phone: rawPhone,
    postcode: rawPostcode,
    email: rawEmail || 'Not provided',
    message: rawMessage || 'No message provided',
    page: location.href,
    timestamp: new Date().toLocaleString('en-GB', { dateStyle: 'full', timeStyle: 'short' })
  });

  if (result.success) {
    addMsg(`<strong>✅ Thank you, ${name}!</strong>\n\nYour request has been sent to our team. We'll contact you shortly at ${phone}.\n\n<div class="info-box">📞 Need to speak to us sooner? Call <strong>01920 468674</strong></div>`, true);
  } else {
    addMsg(fallbackBookingMessage(name, postcode, phone), true);
  }

  if (submitBtn) {
    submitBtn.innerHTML = originalText;
    submitBtn.disabled = false;
  }
}

// MESSAGE HANDLING + PERSISTENCE
// Conversation is kept in localStorage so refreshing the page (or a customer
// coming back later the same day) doesn't wipe out the chat they already had.
// ════════════════════════════════════════════════════════════════════════════════
const HISTORY_KEY = 'flamey_chat_history_v2';
const HISTORY_LIMIT = 40;

function renderMsg(html, fromBot) {
  const messagesDiv = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = fromBot ? 'bot msg' : 'user msg';

  if (fromBot) {
    div.innerHTML = `
      <div class="avatar" style="width:42px;height:42px;" aria-hidden="true">${flamey}</div>
      <div class="bot-bubble">${html}</div>

    div.innerHTML = `<div class="user">${html}</div>`;

  messagesDiv.appendChild(div);
  div.scrollIntoView({behavior: 'smooth', block: 'end'});

function saveHistory(history) {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(-HISTORY_LIMIT)));
  } catch (error) {
    console.error('Could not save chat history:', error);
  }
}

function loadHistory() {
  try {
    const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || 'null');
    return Array.isArray(saved) ? saved : [];
  } catch (error) {
    return [];
  }
}

let chatHistory = [];

function addMsg(text, fromBot = true) {
  const html = fromBot ? text : escapeHtml(text).replace(/\n/g, '<br>');
  renderMsg(html, fromBot);
  chatHistory.push({ html, fromBot });
  saveHistory(chatHistory);
}

function showTypingIndicator() {
  const messagesDiv = document.getElementById('messages');
  const typingDiv = document.createElement('div');
  typingDiv.className = 'bot';
  typingDiv.id = 'typing-indicator';
  typingDiv.innerHTML = `
    <div class="avatar" style="width:42px;height:42px;" aria-hidden="true">${flamey}</div>
    <div class="bot-bubble">
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>
  `;
  messagesDiv.appendChild(typingDiv);
  typingDiv.scrollIntoView({behavior: 'smooth', block: 'end'});
}

function removeTypingIndicator() {
  const indicator = document.getElementById('typing-indicator');
  if (indicator) indicator.remove();
}

// ════════════════════════════════════════════════════════════════════════════════
// USER INPUT HANDLING
// ════════════════════════════════════════════════════════════════════════════════
async function send() {
  const input = document.getElementById('user-input');
  const rawText = input.value.trim();
  if (!rawText) return;

  addMsg(rawText, false);
  input.value = '';

  const sendBtn = document.getElementById('send-btn');
  sendBtn.disabled = true;
  input.disabled = true;

  showTypingIndicator();

  await new Promise(resolve => setTimeout(resolve, 600 + Math.random() * 800));

  const intent = resolveFollowup(rawText) || analyzeIntent(rawText);
  const response = generateResponse(intent, rawText);

  removeTypingIndicator();
  addMsg(response, true);

  if (intent.intent !== 'followup_booking') {
    conversationContext.lastIntent = intent.intent;
  }
  if (intent.intent === 'general_help') {
    logUnanswered(rawText);
  }

  sendBtn.disabled = false;
  input.disabled = false;
  input.focus();
}

// ════════════════════════════════════════════════════════════════════════════════
// QUICK BUTTONS
// ════════════════════════════════════════════════════════════════════════════════
function quick(type) {
  const questions = {
    'prices': 'What are your prices?',
    'boiler-service': 'How much is a boiler service?',
    'installation': 'Tell me about boiler installation',
    'areas': 'What areas do you cover?',
    'water-softener': 'Tell me about water softeners',
    'lpg': 'Tell me about LPG',
    'services': 'What services do you offer?',
    'repairs': 'I need a boiler repair'
  };

  document.getElementById('user-input').value = questions[type] || '';
  send();
}

// ════════════════════════════════════════════════════════════════════════════════
// CHAT UI - ALWAYS VISIBLE
// ════════════════════════════════════════════════════════════════════════════════

window.addEventListener('DOMContentLoaded', function() {
  const saved = loadHistory();
  if (saved.length) {
    chatHistory = saved;
    saved.forEach(item => renderMsg(item.html, item.fromBot));
    conversationContext.greetedOnce = true;
  } else {
    setTimeout(() => {
      addMsg(generateResponse({ intent: 'greeting' }, ''), true);
    }, 500);
  }
});

document.getElementById('user-input').onkeypress = (e) => {
  if (e.key === 'Enter') send();
};
document.getElementById('send-btn').onclick = send;

console.log('🔥 Flamey chatbot initialized');
</script>
