<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flamey – Wrights Heating & Gas Services Assistant</title>

  <style>
    /* Flamey fills whatever box Google Sites gives it (its iframe), from a
       small phone up to a desktop column, instead of floating at a fixed size. */
    :root {
      --pink: #e91e93;
      --deep-purple: #5a2d82;
      --light-pink: #ff1493;
      --ink: #2a2235;
      --line: #eadff2;
      --tint: #fff4f9;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      -webkit-text-size-adjust: 100%;
    }

    #open-btn { display: none; }

    #chat-container {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Header */
    #header {
      flex: 0 0 auto;
      background: linear-gradient(135deg, var(--pink), var(--light-pink), var(--deep-purple));
      color: #fff;
      padding: 12px 16px;
      display: flex; align-items: center; gap: 12px;
    }
    #header h2 { margin: 0; font-size: 1.2rem; line-height: 1.2; }
    #header p { margin: 2px 0 0; font-size: 0.85rem; opacity: 0.92; }
    .avatar { width: 48px; height: 48px; flex: 0 0 auto; }
    .avatar svg { width: 100%; height: 100%; display: block; }
    .avatar.small { width: 34px; height: 34px; }

    /* Messages: the only part that scrolls */
    #messages {
      position: relative;
      flex: 1 1 auto; min-height: 0;
      overflow-y: auto; overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 14px 12px;
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb { background: #f3b6d8; border-radius: 3px; }

    .msg { margin-bottom: 12px; line-height: 1.5; font-size: 15px; animation: fadeIn 0.25s ease-out; }
    .bot { display: flex; align-items: flex-start; gap: 8px; max-width: 100%; }
    .bot-bubble {
      flex: 1 1 auto; min-width: 0; max-width: 560px;
      background: #fff;
      border: 2px solid var(--pink);
      border-radius: 18px; border-top-left-radius: 4px;
      padding: 12px 14px;
      white-space: pre-line;           /* line breaks in Flamey's answers */
      overflow-wrap: anywhere;
    }
    .bot-bubble > strong:first-child { display: block; color: var(--deep-purple); font-size: 1.02rem; margin-bottom: 4px; }
    .bot-bubble strong { color: var(--deep-purple); }
    .bot-bubble a { color: var(--deep-purple); }
    .bot-bubble .muted { color: #6b6178; font-weight: 400; font-size: 0.9em; }
    .bot-bubble .contact-form, .bot-bubble .action-buttons, .bot-bubble .slot-offer,
    .bot-bubble .price-box, .bot-bubble .info-box { white-space: normal; }

    .user-row { display: flex; justify-content: flex-end; }
    .user {
      max-width: 85%;
      background: var(--deep-purple); color: #fff;
      border-radius: 18px; border-top-right-radius: 4px;
      padding: 10px 14px;
      overflow-wrap: anywhere;
    }

    .price-box {
      background: var(--tint);
      border: 2px solid var(--pink);
      border-radius: 12px;
      padding: 10px 14px; margin: 8px 0;
      font-weight: 600; color: var(--deep-purple);
    }
    .price-box .price { font-size: 1.3rem; color: var(--pink); display: block; margin: 2px 0; }
    .info-box {
      background: #f3eef9;
      border-left: 4px solid var(--deep-purple);
      padding: 10px 12px; margin: 8px 0;
      border-radius: 6px; font-size: 0.92rem;
    }

    #typing-indicator .bot-bubble { white-space: normal; padding: 0; }
    .typing-indicator { display: flex; gap: 4px; padding: 12px 16px; }
    .typing-indicator span { width: 8px; height: 8px; border-radius: 50%; background: var(--pink); animation: typing 1.4s infinite; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-8px); opacity: 1; }
    }

    .action-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .action-btn {
      min-height: 40px; padding: 6px 14px;
      border-radius: 999px; border: 2px solid var(--pink);
      background: #fff; color: #b0126c;
      font: 600 0.88rem/1.2 inherit; font-family: inherit;
      cursor: pointer;
    }
    .action-btn:hover { background: var(--pink); color: #fff; }

    /* Quick questions: one row you swipe sideways, so it never eats the chat */
    #quick {
      flex: 0 0 auto;
      display: flex; gap: 8px;
      overflow-x: auto; overflow-y: hidden;
      padding: 8px 12px;
      border-top: 1px solid var(--line);
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      mask-image: linear-gradient(to right, #000 88%, transparent);
      -webkit-mask-image: linear-gradient(to right, #000 88%, transparent);
    }
    #quick::-webkit-scrollbar { display: none; }
    .quick-btn {
      flex: 0 0 auto; white-space: nowrap;
      min-height: 36px; padding: 0 14px;
      border-radius: 999px; border: none;
      background: #ffe4f0; color: #b0126c;
      font: 500 0.85rem inherit; font-family: inherit;
      cursor: pointer;
    }
    .quick-btn:last-child { margin-right: 24px; }
    .quick-btn:hover { background: var(--pink); color: #fff; }
    .quick-btn i { margin-right: 4px; }

    /* Typing box */
    #input-area {
      flex: 0 0 auto;
      display: flex; gap: 8px; align-items: center;
      padding: 8px 12px 12px;
    }
    #user-input {
      flex: 1; min-width: 0;
      height: 46px; padding: 0 16px;
      border: 2px solid #ddd; border-radius: 999px;
      font-size: 16px;                 /* 16px stops iPhones zooming in */
      font-family: inherit; outline: none;
    }
    #user-input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(233,30,147,0.12); }
    #send-btn {
      flex: 0 0 46px; width: 46px; height: 46px;
      background: linear-gradient(135deg, var(--pink), var(--light-pink));
      color: #fff; border: none; border-radius: 50%;
      font-size: 1.1rem; cursor: pointer;
    }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Booking form */
    .contact-form { background: #faf7fc; padding: 12px; border-radius: 12px; margin-top: 6px; }
    .form-intro { font-size: 0.9rem; margin: 6px 0 12px; }
    .form-note { font-size: 0.78rem; color: #6b6178; margin: 10px 0 0; text-align: center; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--deep-purple); margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 10px 12px;
      border: 2px solid #ddd; border-radius: 8px;
      font-size: 16px; font-family: inherit; background: #fff;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--pink); }
    .submit-btn {
      width: 100%; min-height: 46px;
      background: linear-gradient(135deg, var(--pink), var(--light-pink));
      color: #fff; border: none; border-radius: 8px;
      font-size: 1rem; font-weight: 600; font-family: inherit; cursor: pointer;
    }

    .slot-offer { margin-top: 10px; padding: 12px; border: 2px solid var(--pink); border-radius: 10px; background: var(--tint); font-size: 0.95rem; }
    .slot-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .slot-actions button { min-height: 44px; padding: 0 14px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; font-family: inherit; }
    .slot-actions .slot-yes { background: var(--deep-purple); color: #fff; border: 2px solid var(--deep-purple); }
    .slot-actions .slot-other { background: #fff; color: var(--deep-purple); border: 2px solid var(--deep-purple); }
    .slot-actions button:disabled { opacity: 0.5; cursor: default; }

    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--deep-purple); outline-offset: 2px;
    }

    /* Narrow boxes (phones) */
    @media (max-width: 420px) {
      #chat-container { border-radius: 14px; }
      #header { padding: 10px 12px; gap: 10px; }
      .avatar { width: 40px; height: 40px; }
      .avatar.small { display: none; }
      #messages { padding: 12px 10px; }
      .msg { font-size: 14.5px; }
      .bot-bubble { padding: 10px 12px; }
    }
    /* Short boxes: slim header so there's room to read */
    @media (max-height: 560px) {
      #header { padding: 8px 12px; }
      #header h2 { font-size: 1.05rem; }
      #header p { display: none; }
      .avatar { width: 34px; height: 34px; }
      #quick { padding: 6px 12px; }
      #input-area { padding: 6px 12px 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .msg, .typing-indicator span { animation: none; }
    }
  </style>
</head>

// LIGHTWEIGHT TYPO TOLERANCE
// Swaps obviously-mistyped domain words ("bolier", "instalation") for their correct
// spelling before intent matching runs, without any external library or API call.
// ════════════════════════════════════════════════════════════════════════════════
function levenshtein(a, b) {
  // Optimal-string-alignment distance: like Levenshtein but also treats an
  // adjacent transposition ("bolier" -> "boiler") as a single edit, since
  // swapped letters are one of the most common typing mistakes.
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const d = [];
  for (let i = 0; i <= m; i++) d.push(new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) d[i][0] = i;
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) {
        d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
      }
    }
  }
  return d[m][n];
}

const FUZZY_TERMS = [
  'boiler', 'service', 'serviced', 'servicing', 'installation', 'install', 'repair',
  'repairs', 'broken', 'landlord', 'certificate', 'softener', 'water', 'plumbing',
  'bathroom', 'cooker', 'appliance', 'emergency', 'urgent', 'price', 'prices', 'quote',
  'cover', 'coverage', 'area', 'lpg', 'propane', 'radiator', 'thermostat', 'cylinder',
  'pressure', 'leaking', 'heating', 'conditioning', 'landlord', 'shower', 'toilet'
];

function normalizeTypos(msg) {
  return msg.split(/\s+/).map(word => {
    const clean = word.replace(/[^a-z]/gi, '').toLowerCase();
    if (clean.length < 4) return word;
    let best = null, bestDist = Infinity;
    for (const term of FUZZY_TERMS) {
      if (Math.abs(term.length - clean.length) > 2) continue;
      const d = levenshtein(clean, term);
      if (d < bestDist) { bestDist = d; best = term; }
    }
    const threshold = clean.length <= 6 ? 1 : 2;
    return (best && bestDist > 0 && bestDist <= threshold) ? best : word;
  }).join(' ');
}

// ════════════════════════════════════════════════════════════════════════════════
// INTENT RECOGNITION — HELP-FIRST MENTALITY
// Checked in order of priority: safety first, then price, then specific services,
// falling back to a general-help menu only when nothing else matches.
// ════════════════════════════════════════════════════════════════════════════════
function analyzeIntent(userMessageRaw) {
  const msg = normalizeTypos(userMessageRaw.toLowerCase());
  const has = re => re.test(msg);

  // SAFETY FIRST: gas smell or carbon monoxide always gets the emergency number
  if (has(/(gas smell|smell(ing)? (of )?gas|gas leak|leaking gas|carbon monoxide|\bco alarm\b|co detector)/)) {
    return { intent: 'gas_safety_emergency', confidence: 0.99 };
  }
  if (has(/(flooding|\bflood\b|\bemergency\b|\burgent\b|\basap\b|right now|immediately|today)/)) {
    return { intent: 'urgent_booking', confidence: 0.95 };
  }

  // AIR CONDITIONING (from 2027)
  if (has(/(air ?con|air conditioning|\bac unit|\ba\/c\b|aircon|cooling system|split system|multi.?split|cassette)/)) {
    return { intent: 'aircon', confidence: 0.95 };
  }

  // PRICES
  if (has(/(how much|price|prices|cost|charge|fee|pricing|rate|rates|tariff)/)) {
    if (has(/(power ?flush)/)) return { intent: 'price_powerflush', confidence: 0.95 };
    if (has(/(boiler service|service (my |the )?boiler|annual service|servicing)/)) return { intent: 'price_boiler_service', confidence: 0.95 };
    if (has(/(landlord|certificate|\bcp12\b|gas safe(ty)? (check|cert))/)) return { intent: 'price_landlord_cert', confidence: 0.95 };
    if (has(/(\btaps?\b|toilet|\bloo\b|shower|leak|pipe|radiator|plumb)/)) return { intent: 'price_plumbing', confidence: 0.9 };
    if (has(/(cooker|\bhob\b|oven|gas fire|tightness)/)) return { intent: 'price_gas_appliances', confidence: 0.9 };
    if (has(/(new boiler|boiler install|replace(ment)?|central heating|new heating|underfloor|combi)/)) return { intent: 'price_installation', confidence: 0.95 };
    if (has(/(thermostat|smart)/)) return { intent: 'price_installation', confidence: 0.85 };
    if (has(/(repair|fix|call.?out|callout|hourly|per hour|labour|day rate)/)) return { intent: 'price_repair', confidence: 0.9 };
    return { intent: 'pricing_general', confidence: 0.85 };
  }

  if (has(/(^|\s)quote\b/)) return { intent: 'installation', confidence: 0.8 };

  // GREETING
  if (has(/^(hi|hello|hey|good morning|good afternoon|good evening|hiya|morning|afternoon)\b/)) {
    return { intent: 'greeting', confidence: 0.9 };
  }

  // ABOUT THE BUSINESS
  if (has(/(opening hours|open on|are you open|what time|when are you|hours|weekend|saturday|sunday|bank holiday)/)) {
    return { intent: 'hours_contact', confidence: 0.9 };
  }
  if (has(/(phone number|contact|email|call you|ring you|speak to)/)) {
    return { intent: 'hours_contact', confidence: 0.85 };
  }
  if (has(/(\bpay\b|payment|card|cash|bank transfer|invoice)/)) {
    return { intent: 'payment', confidence: 0.9 };
  }
  if (has(/(guarantee|warranty|insured|insurance|gas safe|watersafe|water safe|ciphe|qualified|accredit|registered|trust|reviews?|experience|about you|who are you)/)) {
    return { intent: 'about', confidence: 0.85 };
  }
  if (has(/(what (services?|do you do|work do you)|services? do you|what can you help|everything you do|all services?)/)) {
    return { intent: 'services_overview', confidence: 0.9 };
  }

  // SERVICES
  if (has(/(boiler service|annual service|service (my |the )?boiler|boiler check|servicing)/)) {
    return { intent: 'boiler_service_info', confidence: 0.9 };
  }
  if (has(/(water softener|hard water|limescale|\bscale\b)/)) return { intent: 'water_softener', confidence: 0.9 };
  if (has(/(\blpg\b|propane|bottled gas|gas tank|bulk tank|park home|campervan|motorhome)/)) return { intent: 'lpg', confidence: 0.9 };
  if (has(/(power ?flush)/)) return { intent: 'repairs', confidence: 0.85 };
  if (has(/(cooker|\bhob\b|\boven\b|gas fire|\bfire\b|water heater|space heater|cylinder)/)) return { intent: 'appliances', confidence: 0.85 };
  if (has(/(plumbing|plumber|bathroom|\btap\b|shower|toilet|\bloo\b|\bsink\b|\bdrain\b|drainage|blocked|burst pipe|waste pipe)/)) return { intent: 'plumbing', confidence: 0.85 };
  if (has(/(new boiler|boiler install|\binstallation\b|\binstall\b|replacement|replace (my |the )?boiler|upgrade|underfloor|central heating|new heating|combi)/)) return { intent: 'installation', confidence: 0.9 };
  if (has(/(repair|fix|broken|fault|not working|stopped working|no heating|no hot water|leak|leaking|pilot light|pressure|radiator|thermostat|noisy|banging|error code|locked out|lockout)/)) return { intent: 'repairs', confidence: 0.85 };
  if (has(/(landlord|certificate|\bcp12\b|gas safety check|gas safe check|letting|tenant)/)) return { intent: 'landlord_cert', confidence: 0.9 };

  // COVERAGE (a town name or "do you cover")
  const town = knowledgeBase.coverage.towns.find(t => msg.includes(t.toLowerCase()));
  if (town || has(/(\barea\b|\bareas\b|\bcover\b|location|\bwhere\b|region|do you serve|come to|postcode|near me|north london|essex|hertfordshire|herts)/)) {
    return { intent: 'coverage', confidence: 0.85, town };
  }

  // BOOKING
  if (has(/(\bbook\b|booking|appointment|\bvisit\b|arrange|schedule|come out|available|availability)/)) {
    return { intent: 'booking', confidence: 0.9 };
  }

  return { intent: 'general_help', confidence: 0.6 };
}

// ════════════════════════════════════════════════════════════════════════════════
// CONVERSATION CONTEXT — lets short follow-ups ("ok", "how much is that") resolve
// against whatever was just being discussed, instead of being treated as brand-new,
// context-free questions every time.
// ════════════════════════════════════════════════════════════════════════════════
const conversationContext = {
  lastIntent: null,
  greetedOnce: false,
  fallbackCount: 0
};

const FOLLOWUP_RE = /^(ok|okay|yes|yeah|yep|sure|please do|sounds good|go ahead|book it|book that|do that|and that|what about that|how much is that|how much for that)[.!]?$/i;

const FOLLOWUP_BOOKING_TYPE = {
  boiler_service_info: 'service', price_boiler_service: 'service',
  installation: 'quote', price_installation: 'quote',
  repairs: 'repair', price_repair: 'repair', price_powerflush: 'repair',
  landlord_cert: 'certificate', price_landlord_cert: 'landlord',
  water_softener: 'quote', pricing_general: 'quote', coverage: 'quote',
  lpg: 'quote', plumbing: 'other', price_plumbing: 'other', appliances: 'other',
  price_gas_appliances: 'other', aircon: 'aircon', urgent_booking: 'repair'
};

function resolveFollowup(rawText) {
  const trimmed = rawText.trim();
  if (!FOLLOWUP_RE.test(trimmed) || !conversationContext.lastIntent) return null;
  const bookingType = FOLLOWUP_BOOKING_TYPE[conversationContext.lastIntent];
  if (!bookingType) return null;
  return { intent: 'followup_booking', confidence: 0.8, bookingType };
}

// ════════════════════════════════════════════════════════════════════════════════
// HTML ESCAPING — every piece of this file that renders raw user input (the chat
// box, and the name/phone/postcode/email/message fields on the booking form) now
// escapes it first. Previously user input went straight into innerHTML unescaped,
// which meant anything typed as HTML (e.g. a pasted <img onerror=...> tag) would
// run directly on the page.
// ════════════════════════════════════════════════════════════════════════════════
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

// ════════════════════════════════════════════════════════════════════════════════
// WEB3FORMS — lead capture + quiet "couldn't answer this" logging.
// Replaces the old EmailJS call, which shipped with a placeholder public key and
// so silently failed on every submission.
// ════════════════════════════════════════════════════════════════════════════════
async function sendToWeb3Forms(payload) {
  if (!web3formsConfigured()) return { success: false, skipped: true };
  try {
    const res = await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({ access_key: CONFIG.WEB3FORMS_ACCESS_KEY, ...payload })
    });
    const data = await res.json().catch(() => ({}));
    return { success: res.ok && !!data.success };
  } catch (error) {
    console.error('Web3Forms submission error:', error);
    return { success: false };
  }
}

async function logUnanswered(question) {
  try {
    const key = question.trim().toLowerCase();
    if (!key) return;
    const logged = JSON.parse(sessionStorage.getItem('flamey_logged_gaps') || '[]');
    if (logged.includes(key) || logged.length >= 5) return;
    logged.push(key);
    sessionStorage.setItem('flamey_logged_gaps', JSON.stringify(logged));
    await sendToWeb3Forms({
      subject: 'Flamey could not answer a customer question',
      from_name: 'Flamey chatbot',
      question: question,
      page: location.href,
      timestamp: new Date().toLocaleString('en-GB', { dateStyle: 'full', timeStyle: 'short' })
    });
  } catch (error) {
    console.error('Gap logging failed:', error);
  }
}

function fallbackBookingMessage(name, postcode, phone) {
  return `<strong>⚠️ Almost there, ${name}!</strong>\n\nPlease call us directly to complete your booking:\n\n<div class="price-box">📞 <strong>01920 468674</strong><br>or<br>📱 <strong>07971 252440</strong></div>\n\nMention:\n• Name: ${name}\n• Postcode: ${postcode}\n• Phone: ${phone}`;
}

// Sends the enquiry to the Wrights scheduler via this project's /api/lead
// function, which holds the scheduler's key server-side. It lands as a pending
// lead on the scheduler's admin screen; nothing is booked automatically.
// slotStatus says whether an agreed slot was held ('held'), had just gone
// ('taken'), or there was none ('none').
async function sendToScheduler(lead) {
  try {
    const res = await fetch('/api/lead', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(lead)
    });
    const data = await res.json().catch(() => ({}));
    return { success: res.ok, slotStatus: data.slotStatus || 'none' };
  } catch (error) {
    console.error('Scheduler lead error:', error);
    return { success: false, slotStatus: 'none' };
  }
}

// ════════════════════════════════════════════════════════════════════════════════
// SLOT OFFERS — Flamey suggests a day from Patrick's diary. If the customer
// agrees, the slot is sent with their lead and held for them; Patrick then
// confirms it from his lead box. Nothing is booked from the chat itself.
// ════════════════════════════════════════════════════════════════════════════════
const SLOT_JOB_TYPES = ['Boiler Service', 'Boiler Repair', 'Gas Safety Certificate', 'Landlord Certificate', 'General Callout'];
const MAX_SLOT_OFFERS = 3;
const pendingBookings = {}; // offer id -> { enquiry, slot, offered: [dates] }; in memory only, so old offers can't be reused after a reload

function jobLabel(value) {
  const job = BOOKING_JOBS.find(j => j.value === value);
  return job ? job.label : 'Enquiry';
}

function friendlyTime(hhmm) {
  const [h, m] = String(hhmm).split(':').map(Number);
  const suffix = h >= 12 ? 'pm' : 'am';
  const hour = h % 12 === 0 ? 12 : h % 12;
  return m ? `${hour}:${String(m).padStart(2, '0')}${suffix}` : `${hour}${suffix}`;
}

function friendlySlot(slot) {
  const day = new Date(slot.date + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  return `${day}, arriving between ${friendlyTime(slot.windowStart)} and ${friendlyTime(slot.windowEnd)}`;
}

async function requestSlot(enquiry, excludeDates) {
  try {
    const res = await fetch('/api/slot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        jobTypeName: enquiry.job,
        postcode: enquiry.postcode,
        addressLine1: enquiry.address,
        city: enquiry.town,
        excludeDates
      })
    });
    const data = await res.json().catch(() => ({}));
    const valid = res.ok && data.outcome === 'slot' &&
      /^\d{4}-\d{2}-\d{2}$/.test(String(data.date)) &&
      /^\d{2}:\d{2}$/.test(String(data.windowStart)) && /^\d{2}:\d{2}$/.test(String(data.windowEnd));
    return valid ? { jobTypeName: data.jobTypeName, date: data.date, windowStart: data.windowStart, windowEnd: data.windowEnd } : null;
  } catch (error) {
    console.error('Slot request failed:', error);
    return null;
  }
}

function offerSlot(enquiry, slot, previouslyOffered) {
  const id = 'offer-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
  pendingBookings[id] = { enquiry, slot, offered: [...previouslyOffered, slot.date] };
  const intro = previouslyOffered.length
    ? `How about this instead, ${escapeHtml(enquiry.name)}?`
    : `Thanks, ${escapeHtml(enquiry.name)}! The best day I can see for your ${escapeHtml(jobLabel(enquiry.job).toLowerCase())} is:`;
  addMsg(`${intro}
<div class="slot-offer">
  <strong>📅 ${escapeHtml(friendlySlot(slot))}</strong>
  <div style="font-size:0.85rem;margin-top:6px;">Patrick will confirm it with you before it's booked.</div>
  <div class="slot-actions">
    <button class="slot-yes" onclick="acceptSlot('${id}', this)">Yes, that works</button>
    <button class="slot-other" onclick="anotherSlot('${id}', this)">Another day</button>
    <button class="slot-other" onclick="skipSlot('${id}', this)">Just call me</button>
  </div>
</div>`, true);
}

// Each offer can be answered once; buttons in saved chat history from an
// earlier visit have no matching offer, so they just say it has expired.
function takeOffer(id, button) {
  const box = button && button.closest('.slot-offer');
  if (box) box.querySelectorAll('button').forEach(b => { b.disabled = true; });
  const state = pendingBookings[id];
  delete pendingBookings[id];
  if (!state) addMsg('That offer has expired. Fill in the booking form again and I\'ll find you a fresh day. 😊', true);
  return state;
}

async function acceptSlot(id, button) {
  const state = takeOffer(id, button);
  if (!state) return;
  addMsg('Yes, that works', false);
  await finishEnquiry(state.enquiry, state.slot);
}

async function anotherSlot(id, button) {
  const state = takeOffer(id, button);
  if (!state) return;
  addMsg('Do you have another day?', false);
  if (state.offered.length >= MAX_SLOT_OFFERS) {
    await finishEnquiry(state.enquiry, null, `Customer didn't take the days offered in the chat (${state.offered.join(', ')}). Please agree a day with them.`);
    return;
  }
  showTypingIndicator();
  const next = await requestSlot(state.enquiry, state.offered);
  removeTypingIndicator();
  if (next) offerSlot(state.enquiry, next, state.offered);
  else await finishEnquiry(state.enquiry, null, `No other day could be offered in the chat (already offered: ${state.offered.join(', ')}).`);
}

async function skipSlot(id, button) {
  const state = takeOffer(id, button);
  if (!state) return;
  addMsg('Just call me', false);
  await finishEnquiry(state.enquiry, null, 'Customer asked to be called rather than pick a day in the chat.');
}

// Sends the enquiry to Patrick's inbox and the scheduler together; the customer
// sees success if either gets through, so a scheduler outage never loses one.
async function finishEnquiry(enquiry, slot, chatNote) {
  const name = escapeHtml(enquiry.name);
  const phone = escapeHtml(enquiry.phone);
  const slotText = slot ? friendlySlot(slot) : '';
  const notes = [
    enquiry.message ? `From Flamey: ${enquiry.message}` : 'From Flamey (no message left)',
    slot ? `Agreed in the chat: ${slotText}.` : '',
    chatNote || ''
  ].filter(Boolean).join(' ');

  const [emailResult, schedulerResult] = await Promise.all([
    sendToWeb3Forms({
      subject: slot
        ? `New Flamey booking request from ${enquiry.name}: ${slotText}`
        : `New Flamey enquiry from ${enquiry.name}`,
      from_name: enquiry.name,
      name: enquiry.name,
      job: jobLabel(enquiry.job),
      requested_slot: slot ? `${slotText} (customer agreed; confirm it in the scheduler's Flamey leads card)` : 'None',
      phone: enquiry.phone,
      address: enquiry.address || 'Not provided',
      town: enquiry.town || 'Not provided',
      postcode: enquiry.postcode,
      email: enquiry.email || 'Not provided',
      message: enquiry.message || 'No message provided',
      chat_note: chatNote || 'None',
      page: location.href,
      timestamp: new Date().toLocaleString('en-GB', { dateStyle: 'full', timeStyle: 'short' })
    }),
    sendToScheduler({
      customerName: enquiry.name,
      addressLine1: enquiry.address,
      city: enquiry.town,
      postcode: enquiry.postcode,
      phone: enquiry.phone,
      email: enquiry.email,
      jobTypeName: SLOT_JOB_TYPES.includes(enquiry.job) ? enquiry.job : undefined,
      requestedJobTypeText: jobLabel(enquiry.job),
      notes,
      agreedSlot: slot ? { jobTypeName: slot.jobTypeName, date: slot.date, startTime: slot.windowStart } : undefined
    })
  ]);

  const callUs = `<div class="info-box">📞 Need to speak to us sooner? Call <strong>01920 468674</strong></div>`;
  if (!emailResult.success && !schedulerResult.success) {
    addMsg(fallbackBookingMessage(name, escapeHtml(enquiry.postcode), phone), true);
  } else if (slot && schedulerResult.success && schedulerResult.slotStatus === 'held') {
    addMsg(`<strong>✅ Thank you, ${name}!</strong>\n\nI've pencilled you in for <strong>${escapeHtml(slotText)}</strong> and held it for you. Patrick will confirm your booking shortly${enquiry.email ? ' by email' : ` on ${phone}`}.\n\n${callUs}`, true);
  } else if (slot && schedulerResult.success && schedulerResult.slotStatus === 'taken') {
    addMsg(`<strong>Thank you, ${name}.</strong>\n\nSorry, that slot was taken a moment ago. I've passed your details to Patrick and he'll be in touch at ${phone} to arrange another day.\n\n${callUs}`, true);
  } else if (slot) {
    addMsg(`<strong>✅ Thank you, ${name}!</strong>\n\nI've sent your request for <strong>${escapeHtml(slotText)}</strong> to our team. Patrick will confirm whether it's still free, or arrange another day with you at ${phone}.\n\n${callUs}`, true);
  } else if (chatNote) {
    addMsg(`<strong>✅ Thank you, ${name}!</strong>\n\nNo problem. I've passed your details to Patrick and he'll call you at ${phone} to find a day that suits.\n\n${callUs}`, true);
  } else {
    const next = enquiry.job === 'aircon'
      ? `You're on our air conditioning list. We'll contact you at ${phone} as soon as we start booking installs in 2027.`
      : `Your request has been sent to our team. We'll contact you shortly at ${phone}.`;
    addMsg(`<strong>✅ Thank you, ${name}!</strong>\n\n${next}\n\n${callUs}`, true);
  }
}

async function submitContactForm(button) {
  // Read the form whose Send button was pressed. Saved chat history can hold
  // earlier copies of this form with the same field IDs, so a page-wide
  // getElementById would pick up an old, empty form instead.
  const form = (button && button.closest('.contact-form')) ||
    [...document.querySelectorAll('.contact-form')].pop() || document;
  const field = (id) => form.querySelector('#' + id)?.value.trim();
  const enquiry = {
    job: field('form-job'),
    name: field('form-name'),
    address: field('form-address'),
    town: field('form-town'),
    postcode: field('form-postcode'),
    phone: field('form-phone'),
    email: field('form-email'),
    message: field('form-message')
  };

  if (!enquiry.job || !enquiry.name || !enquiry.postcode || !enquiry.phone) {
    addMsg("⚠️ Please fill in all required fields (what you need, name, postcode and phone)", true);
    return;
  }

  const submitBtn = button || form.querySelector('.submit-btn');
  const originalText = submitBtn.innerHTML;
  submitBtn.disabled = true;

  try {
    if (SLOT_JOB_TYPES.includes(enquiry.job)) {
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Finding a day...';
      const slot = await requestSlot(enquiry, []);
      if (slot) {
        offerSlot(enquiry, slot, []);
        return;
      }
    }
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
    await finishEnquiry(enquiry, null);
  } finally {
    if (submitBtn) {
      submitBtn.innerHTML = originalText;
      submitBtn.disabled = false;
    }
  }
}

// ════════════════════════════════════════════════════════════════════════════════
// MESSAGE HANDLING + PERSISTENCE
// Conversation is kept in localStorage so refreshing the page (or a customer
// coming back later the same day) doesn't wipe out the chat they already had.
// ════════════════════════════════════════════════════════════════════════════════
const HISTORY_KEY = 'flamey_chat_history_v2';
const HISTORY_LIMIT = 40;

function renderMsg(html, fromBot) {
  const messagesDiv = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = fromBot ? 'bot msg' : 'user-row msg';

  if (fromBot) {
    div.innerHTML = `
      <div class="avatar small" aria-hidden="true">${flamey}</div>
      <div class="bot-bubble">${html}</div>
    `;
  } else {
    div.innerHTML = `<div class="user">${html}</div>`;
  }

  messagesDiv.appendChild(div);
  // Scroll only the chat box (scrollIntoView would also jump the website page).
  // Long answers are shown from their first line, so customers read from the top.
  const top = fromBot && div.offsetHeight > messagesDiv.clientHeight
    ? div.offsetTop - 8
    : messagesDiv.scrollHeight;
  messagesDiv.scrollTo({ top, behavior: 'smooth' });
  return div;
}

function saveHistory(history) {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(-HISTORY_LIMIT)));
  } catch (error) {
    console.error('Could not save chat history:', error);
  }
}

function loadHistory() {
  try {
    const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || 'null');
    return Array.isArray(saved) ? saved : [];
  } catch (error) {
    return [];
  }
}

let chatHistory = [];

function addMsg(text, fromBot = true) {
  const html = fromBot ? text : escapeHtml(text).replace(/\n/g, '<br>');
  renderMsg(html, fromBot);
  chatHistory.push({ html, fromBot });
  saveHistory(chatHistory);
}

function showTypingIndicator() {
  const messagesDiv = document.getElementById('messages');
  const typingDiv = document.createElement('div');
  typingDiv.className = 'bot';
  typingDiv.id = 'typing-indicator';
  typingDiv.innerHTML = `
    <div class="avatar small" aria-hidden="true">${flamey}</div>
    <div class="bot-bubble">
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>
  `;
  messagesDiv.appendChild(typingDiv);
  messagesDiv.scrollTo({ top: messagesDiv.scrollHeight, behavior: 'smooth' });
}

function removeTypingIndicator() {
  const indicator = document.getElementById('typing-indicator');
  if (indicator) indicator.remove();
}

// ════════════════════════════════════════════════════════════════════════════════
// USER INPUT HANDLING
// ════════════════════════════════════════════════════════════════════════════════
async function send() {
  const input = document.getElementById('user-input');
  const rawText = input.value.trim();
  if (!rawText) return;

  addMsg(rawText, false);
  input.value = '';

  const sendBtn = document.getElementById('send-btn');
  sendBtn.disabled = true;
  input.disabled = true;

  showTypingIndicator();

  await new Promise(resolve => setTimeout(resolve, 600 + Math.random() * 800));

  const intent = resolveFollowup(rawText) || analyzeIntent(rawText);
  const response = generateResponse(intent, rawText);

  removeTypingIndicator();
  addMsg(response, true);

  if (intent.intent !== 'followup_booking') {
    conversationContext.lastIntent = intent.intent;
  }
  if (intent.intent === 'general_help') {
    logUnanswered(rawText);
  }

  sendBtn.disabled = false;
  input.disabled = false;
  if (!window.matchMedia("(pointer: coarse)").matches) input.focus(); // no keyboard pop-up on phones
}

      addMsg(generateResponse({ intent: 'greeting' }, ''), true);
    }, 500);
  }
});

  if (e.key === 'Enter') send();
};
